<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفارش لوگو | نماور</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-attachment: fixed;
    color: #fff;
  }
  .bubble {
    position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: 0;
    animation: float 15s infinite ease-in-out;
  }
  .bubble1 { width: 300px; height: 300px; background: #ff6ec4; top: -100px; right: -100px; }
  .bubble2 { width: 250px; height: 250px; background: #7873f5; bottom: -80px; left: -80px; animation-delay: 5s; }
  @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -30px); } }

  header {
    position: sticky; top: 0; z-index: 100; padding: 15px 25px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  .logo { font-size: 20px; font-weight: bold; }
  nav a { color: rgba(255,255,255,0.9); text-decoration: none; margin-right: 20px; font-size: 15px; }
  nav a:hover { color: #fff; }

  .form-section { position: relative; z-index: 1; max-width: 550px; margin: 0 auto; padding: 50px 20px 60px; }
  .page-title { text-align: center; font-size: 30px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(255,255,255,0.4); }
  .glass-card {
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 40px 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  .glass-card h2 { font-size: 22px; margin-bottom: 25px; text-align: center; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: rgba(255,255,255,0.9); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    color: #fff; font-family: inherit; font-size: 15px; transition: all 0.3s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5);
  }
  .form-group select option { background: #2a1f4d; color: #fff; }
  .form-group textarea { resize: vertical; min-height: 90px; }
  .submit-btn {
    width: 100%; padding: 16px; background: linear-gradient(135deg, #f093fb, #f5576c);
    border: none; border-radius: 12px; color: #fff; font-size: 17px; font-weight: bold;
    cursor: pointer; transition: all 0.3s; margin-top: 10px;
  }
  .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(245,87,108,0.4); }

  .back-btn {
    display: inline-block; margin-top: 20px; color: rgba(255,255,255,0.8);
    text-decoration: none; font-size: 14px;
  }
  .back-btn:hover { color: #fff; }

  footer { position: relative; z-index: 1; text-align: center; padding: 25px; color: rgba(255,255,255,0.7); font-size: 13px; border-top: 1px solid rgba(255,255,255,0.15); }

  @media (max-width: 600px) {
    header { flex-direction: column; gap: 10px; }
    nav a { margin: 0 8px; }
  }
</style>
</head>
<body>

  <div class="bubble bubble1"></div>
  <div class="bubble bubble2"></div>

  <header>
    <div class="logo">✦ نماور</div>
    <nav>
      <a href="index.html">خانه</a>
      <a href="order.html">سفارش لوگو</a>
    </nav>
  </header>

  <section class="form-section">
    <h1 class="page-title">📝 فرم سفارش طراحی لوگو</h1>
    <div class="glass-card">
      <h2>اطلاعات خودت رو وارد کن</h2>
      <form action="https://formsubmit.co/alialigolipour13871387@gmail.com" method="POST">
        <div class="form-group">
          <label>نام و نام خانوادگی</label>
          <input type="text" name="name" required placeholder="مثلاً: علی محمدی">
        </div>
        <div class="form-group">
          <label>شماره تماس</label>
          <input type="tel" name="phone" required placeholder="09123456789">
        </div>
        <div class="form-group">
          <label>ایمیل</label>
          <input type="email" name="email" required placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>نام برند / کسب‌وکار</label>
          <input type="text" name="brand" required placeholder="مثلاً: کافه رستوران بهار">
        </div>
        <div class="form-group">
          <label>حوزه فعالیت</label>
          <input type="text" name="industry" placeholder="مثلاً: پوشاک، رستوران، فناوری">
        </div>
        <div class="form-group">
          <label>سبک مورد علاقه</label>
          <select name="style">
            <option value="">انتخاب کنید...</option>
            <option value="minimal">مینیمال و ساده</option>
            <option value="modern">مدرن و خلاقانه</option>
            <option value="classic">کلاسیک و لوکس</option>
            <option value="playful">شاد و رنگی</option>
            <option value="typography">تایپوگرافی (متن‌محور)</option>
          </select>
        </div>
        <div class="form-group">
          <label>رنگ‌های مورد علاقه</label>
          <input type="text" name="colors" placeholder="مثلاً: آبی و طلایی">
        </div>
        <div class="form-group">
          <label>توضیحات بیشتر</label>
          <textarea name="description" placeholder="درباره برندت، مخاطب هدفت، و هر چیزی که فکر می‌کنی کمک می‌کنه بنویس..."></textarea>
        </div>
        <div class="form-group">
          <label>بودجه تقریبی</label>
          <select name="budget">
            <option value="">انتخاب کنید...</option>
            <option value="500-1000">۵۰۰ هزار تا ۱ میلیون تومان</option>
            <option value="1000-2000">۱ تا ۲ میلیون تومان</option>
            <option value="2000-5000">۲ تا ۵ میلیون تومان</option>
            <option value="5000+">بیشتر از ۵ میلیون تومان</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">🚀 ارسال سفارش</button>
      </form>
      <div style="text-align:center;">
        <a href="index.html" class="back-btn">← بازگشت به صفحه اصلی</a>
      </div>
    </div>
  </section>

  <footer>
    © ۱۴۰۵ - نماور | تمام حقوق محفوظ است
  </footer>

</body>
</html>
